name: CI

# Runs on every push and pull request. Configure branch protection on `main`
# to require the "tests" and "lint" checks to pass before a PR can be merged
# (Settings → Branches → Branch protection rules → Require status checks).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHPUnit + MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: elameed_test
          MYSQL_USER: elameed_app
          MYSQL_PASSWORD: elameed_app_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # The test suite reads DB config from phpunit.xml (elameed_test /
      # elameed_app), which points at the MySQL service above.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: elameed_test
      DB_USERNAME: elameed_app
      DB_PASSWORD: elameed_app_secret

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, bcmath, intl, gd, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u elameed_app -pelameed_app_secret --silent; then
              echo "MySQL is up"; break
            fi
            echo "Waiting for MySQL... ($i)"; sleep 2
          done

      - name: Run test suite
        run: php artisan test

  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Fail the build on any style violation (no auto-fix in CI).
      - name: Check code style
        run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis (Larastan, optional)
    runs-on: ubuntu-latest
    # Optional gate — never blocks a merge. Wire it into branch protection only
    # once the codebase is Larastan-clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Larastan (if configured)
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
            if [ -f vendor/bin/phpstan ]; then
              vendor/bin/phpstan analyse --no-progress
            else
              echo "phpstan config present but larastan/larastan is not installed — skipping."
            fi
          else
            echo "No phpstan.neon(.dist) found — Larastan not configured yet, skipping."
          fi
