name: Deploy to staging

# Runs ONLY after the CI workflow succeeds on `main`, so a red build never
# ships. It also stays inert until the team opts in:
#   • set repo variable  STAGING_DEPLOY_ENABLED = true   (Settings → Variables)
#   • add secrets: STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY,
#     STAGING_PATH  (optional: STAGING_SSH_PORT, default 22)
# The target is a Plesk/SSH host; deployment is rsync + remote artisan cache.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only on a green CI run of main, and only when explicitly enabled.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync application to staging
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/app' \
            --exclude='storage/framework' \
            --exclude='storage/logs' \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT:-22}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Run post-deploy commands
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${SSH_PORT:-22}" "${SSH_USER}@${SSH_HOST}" bash -s <<EOF
            set -e
            cd "${DEPLOY_PATH}"
            php artisan down --render="errors::503" || true
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            php artisan queue:restart || true
            php artisan up
          EOF
